# Chips Poker as a single self-contained container: PostgreSQL, Redis, the API
# and the web client all run inside it. All data lives in the chips_data volume.
#
#   docker compose up -d --build     # build from source and start
#   open http://<this-host>:8080     # any host name or IP address works
#
# Optional settings (see README, "Docker deployment"):
#   PUBLIC_WEB_URL  pin password-reset links to one public URL (use with SMTP)
#   TRUST_PROXY=1   when a TLS reverse proxy sits in front of the container
#   DATABASE_URL / REDIS_URL  use external servers instead of the bundled ones
services:
  chips-poker:
    build: .
    image: chips-poker:1.2.0
    restart: unless-stopped
    ports:
      - "${CHIPS_PORT:-8080}:8080"
    volumes:
      - chips_data:/data
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-0}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      ALLOW_MULTI_ACCOUNT: ${ALLOW_MULTI_ACCOUNT:-false}
    stop_grace_period: 30s

volumes:
  chips_data:
